# Prometheus Configuration for Monitoring Flask App
# Place this file in /etc/prometheus/ or your Prometheus config directory

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'flask-app-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Flask application metrics
  - job_name: 'flask-app'
    static_configs:
      - targets: ['localhost:5000']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node exporter (if running)
  # - job_name: 'node'
  #   static_configs:
  #     - targets: ['localhost:9100']

