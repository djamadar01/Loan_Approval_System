version: '3.8'

services:
  # FastAPI Application
  loan-decision-api:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: loan-decision-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=false
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/loan_decisions}
    volumes:
      - ./main.py:/app/main.py
      - ./loan_orchestrator.py:/app/loan_orchestrator.py
      - ./logs:/app/logs
    depends_on:
      - postgres
    networks:
      - loan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  # PostgreSQL Database (optional)
  postgres:
    image: postgres:15-alpine
    container_name: loan-decision-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=loan_decisions
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - loan-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: loan-decision-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - loan-decision-api
    networks:
      - loan-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  loan-network:
    driver: bridge
